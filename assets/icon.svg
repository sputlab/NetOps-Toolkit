<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#091423" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa" />
      <stop offset="100%" stop-color="#0090ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#1e3050" stroke-width="8" opacity="0.6" />

  <!-- Network Nodes & Connecting Grid -->
  <g stroke="#1e3050" stroke-width="4" stroke-dasharray="6,6">
    <line x1="128" y1="128" x2="384" y2="128" />
    <line x1="128" y1="384" x2="384" y2="384" />
    <line x1="128" y1="128" x2="128" y2="384" />
    <line x1="384" y1="128" x2="384" y2="384" />
  </g>

  <!-- Corner Mini Nodes -->
  <circle cx="128" cy="128" r="8" fill="#1e3050" />
  <circle cx="384" cy="128" r="8" fill="#1e3050" />
  <circle cx="128" cy="384" r="8" fill="#1e3050" />
  <circle cx="384" cy="384" r="8" fill="#1e3050" />

  <!-- Main 'N' Emblem with Glowing Circuit Lines -->
  <path d="M 160 370 L 160 142 L 210 142 L 302 300 L 302 142 L 352 142 L 352 370 L 302 370 L 210 212 L 210 370 Z" 
        fill="url(#accentGrad)" 
        filter="url(#glow)" />

  <!-- Active Network Pulse Dots -->
  <circle cx="160" cy="142" r="10" fill="#00d4aa" />
  <circle cx="352" cy="370" r="10" fill="#0090ff" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>
